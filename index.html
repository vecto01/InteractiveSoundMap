<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading-screen" class="loading-spinner">
        <div class="loading-message">Loading sound map...</div>
    </div>
    
    <div class="controls">
        <p style="color: #FFFFFF; text-decoration: underline; text-decoration-color: #4CAF50; text-decoration-thickness: 1px; font-weight: 500;">Drag to explore →</p>
        <div class="control-group">
            <button class="btn">Sound Type</button>
        </div>
        <input type="range" class="slider" min="0" max="100" value="50">
        <div class="control-group">
            <button class="btn">Play Example</button>
        </div>
    </div>
    
    <div class="map-container">
        <div id="map-content">
            <div class="no-sources" style="display: none;">No sound sources available yet</div>
        </div>
        <div id="ready-screen" class="ready-message" style="display: none;">Ready! Tap or drag to explore sounds.</div>
    </div>
    
    <div class="footer">
        <p style="color: #666; font-size: 0.8rem; margin-top: 1rem;">© 2023 Interactive Sound Map. All rights reserved.</p>
    </div>
    
    <script src="scripts.js"></script>
</body>
</html>
