<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Interactive Sound Map</h1>
            <div class="theme-toggle">
                <span class="current-theme">Dark</span>
                <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="controls">
                <div class="filter-group">
                    <label for="sound-type">Sound Type:</label>
                    <select id="sound-type" aria-label="Select sound type">
                        <option value="all">All</option>
                        <option value="music">Music</option>
                        <option value="nature">Nature</option>
                        <option value="noise">Noise</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="intensity">Intensity:</label>
                    <input type="range" id="intensity" min="10" max="100" value="50" aria-label="Adjust sound intensity">
                </div>
            </div>
            
            <div id="sound-map" class="sound-map">
                <div class="loading-container">
                    <div id="loading-spinner" class="loading-spinner">
                        <svg class="spinner" viewBox="0 0 50 50">
                            <circle class="circle" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="interactive-example">
                <p>Drag to explore the sound map. Use filters below.</p>
                <div class="example-play-button">
                    <button id="play-example" aria-label="Play example sound">Play Example</button>
                </div>
            </div>
            
            <div class="instructions">
                <p>Drag to explore the sound map. Adjust filters below.</p>
            </div>
        </main>
        
        <footer class="footer">
            <p>© 2024 Interactive Sound Map. Explore sounds interactively.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
