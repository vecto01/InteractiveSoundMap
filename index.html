<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-progress-container">
            <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div class="loading-message"></div>
    </div>
    
    <div class="controls-container">
        <div class="controls">
            <button class="btn disabled" aria-disabled="true">Sound Type</button>
            <button class="btn disabled" aria-disabled="true">Play Example</button>
            <input type="range" class="slider" min="0" max="100" value="50">
        </div>
    </div>
    
    <div class="map-container" id="mapContainer">
        <p class="map-text">Drag to explore the sound map</p>
    </div>
    
    <div class="footer">
        <span>© 2023 Interactive Sound Map</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingSpinner = document.querySelector('.loading-spinner');
            const loadingMessage = document.querySelector('.loading-message');
            const mapContainer = document.querySelector('.map-container');
            const progressBar = document.querySelector('.progress-bar');
            
            // Имитация загрузки с плавными анимациями
            setTimeout(() => {
                loadingSpinner.classList.add('active');
                loadingMessage.textContent = 'Loading...';
                progressBar.style.width = '25%';
                progressBar.setAttribute('aria-valuenow', '25');
            }, 500);
            
            setTimeout(() => {
                loadingSpinner.classList.add('pulse');
                setTimeout(() => {
                    loadingSpinner.classList.remove('pulse');
                    loadingMessage.textContent = 'Ready!';
                    
                    // Плавное появление контейнера
                    mapContainer.style.opacity = '0';
                    mapContainer.style.transform = 'scale(0.95) translateY(10px)';
                    
                    mapContainer.style.transition = 'opacity 0.5s ease, transform 0.5s ease, height 0.5s ease';
                    
                    setTimeout(() => {
                        mapContainer.style.opacity = '1';
                        mapContainer.style.transform = 'scale(1) translateY(0)';
                        mapContainer.style.height = 'auto';
                    }, 500);
                }, 500);
            }, 1200);
            
            // Деактивация кнопок до завершения загрузки
            document.querySelectorAll('.btn').forEach(button => {
                button.classList.add('disabled');
                button.setAttribute('aria-disabled', 'true');
            });
        });
    </script>
</body>
</html>
