<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="map-container">
        <!-- Контент будет добавлен динамически -->
    </div>
    <footer>
        <p>Interactive Sound Map</p>
    </footer>
    <script>
        // Placeholder for JavaScript logic
        window.addEventListener('DOMContentLoaded', function() {
            const body = document.body;
            const themeToggle = document.createElement('button');
            themeToggle.textContent = 'Dark Mode';
            themeToggle.className = 'btn';
            body.appendChild(themeToggle);
            
            themeToggle.addEventListener('click', function() {
                body.classList.toggle('dark-theme');
                body.classList.remove('light-theme');
            });
        });
    </script>
    <script>
        // Placeholder for sound data
        const soundData = [
            {
                name: 'Ambient Noise',
                description: 'Soft sounds from the environment',
                frequency: 50
            },
            {
                name: 'City Traffic',
                description: 'Sounds of city life',
                frequency: 75
            }
        ];
        
        // Render cards dynamically
        function renderCards() {
            const container = document.querySelector('.map-container');
            container.innerHTML = ''; // Clear existing content
            
            soundData.forEach(sound => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>${sound.name}</h3><p>${sound.description}</p><p>Frequency: ${sound.frequency} Hz</p>`;
                container.appendChild(card);
            });
        }
        
        window.addEventListener('DOMContentLoaded', renderCards);
    </script>
</body>
</html>
