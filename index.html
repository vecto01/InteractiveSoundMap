<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="loading-spinner"></div>
    <div class="loading-message"></div>
    
    <div class="controls">
        <button class="btn">Sound Type</button>
        <button class="btn">Play Example</button>
        <input type="range" class="slider" min="0" max="100" value="50">
    </div>
    
    <div class="map-container">
        <p>Drag to explore the sound map</p>
    </div>
    
    <div class="fixed-footer">
        <span style="color: #CCCCCC;">© 2023 Interactive Sound Map</span>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingSpinner = document.querySelector('.loading-spinner');
            const loadingMessage = document.querySelector('.loading-message');
            const mapContainer = document.querySelector('.map-container');
            
            // Имитация загрузки с плавными анимациями
            setTimeout(() => {
                loadingSpinner.classList.add('active');
                loadingMessage.textContent = 'Loading sound map...';
            }, 1000);
            
            setTimeout(() => {
                loadingSpinner.classList.remove('active');
                loadingMessage.classList.add('loading');
                
                // Плавное появление контейнера
                mapContainer.style.opacity = '0';
                mapContainer.style.transform = 'scale(0.98)';
                
                setTimeout(() => {
                    mapContainer.style.opacity = '1';
                    mapContainer.style.transform = 'scale(1)';
                }, 500);
            }, 2000);
            
            // Анимация footer при скролле
            window.addEventListener('scroll', function() {
                const footer = document.querySelector('.fixed-footer');
                if (window.scrollY > 100) {
                    footer.style.animation = 'scrollFadeIn 0.3s ease-out';
                } else {
                    footer.style.animation = 'none';
                }
            });
        });
    </script>
</body>
</html>
