<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Логика загрузки
        document.addEventListener('DOMContentLoaded', function() {
            const loadingSpinner = document.getElementById('loading-spinner');
            const loadingText = document.getElementById('loading-text');
            const soundMap = document.getElementById('sound-map');
            
            // Запуск анимации загрузки
            loadingSpinner.style.display = 'flex';
            loadingText.style.opacity = '1';
            
            // Имитация загрузки карты (замените на реальную загрузку API)
            setTimeout(function() {
                loadingSpinner.style.display = 'none';
                loadingText.style.opacity = '0';
                
                // Показываем карту или интерактивные элементы
                soundMap.innerHTML = '<div class="sound-map-content">Your sound map will appear here.</div>';
                
                // Проверка на ошибки загрузки
                if (soundMap.innerHTML.includes('Your sound map')) {
                    alert('Sound map loaded successfully!');
                } else {
                    alert('Error loading sound map. Please try again.');
                }
            }, 2000);
        });
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Interactive Sound Map</h1>
            <div class="theme-toggle">
                <span class="current-theme">Dark</span>
                <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
            </div>
        </header>
        
        <main class="main-content">
            <div class="controls">
                <div class="filter-group">
                    <label for="sound-type">Sound Type:</label>
                    <select id="sound-type" aria-label="Select sound type">
                        <option value="all">All</option>
                        <option value="music">Music</option>
                        <option value="nature">Nature</option>
                        <option value="noise">Noise</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="intensity">Intensity:</label>
                    <input type="range" id="intensity" min="10" max="100" value="50" aria-label="Adjust sound intensity">
                </div>
            </div>
            
            <div id="sound-map" class="sound-map">
                <div id="loading-spinner" class="skeleton-loader" aria-live="polite">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line"></div>
                </div>
                <div id="loading-text" class="loading-text">Loading map...</div>
            </div>
            
            <div class="interactive-example">
                <p>Drag to explore the sound map.</p>
                <div class="example-play-button">
                    <button id="play-example" aria-label="Play example sound">Play Example</button>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            © 2024 Interactive Sound Map
        </footer>
    </div>
</body>
</html>
