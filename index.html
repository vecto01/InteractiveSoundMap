<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sound Map</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
    <div class="loading-spinner">
        <div class="spinner"></div>
    </div>
    <div class="controls-container loaded">
        <div class="controls">
            <label for="sound-type">Sound Type:</label>
            <select id="sound-type" class="select">
                <option value="ambient">Ambient</option>
                <option value="instrumental">Instrumental</option>
            </select>
            <label for="intensity">Intensity:</label>
            <input type="range" id="intensity" class="slider" min="0" max="100" value="50">
            <button class="btn" id="play-example">Play Example</button>
        </div>
    </div>
    <div class="map-container loaded">
        <h3>Drag to explore...</h3>
        <!-- Карта будет загружаться после анимации загрузки -->
    </div>
    <footer class="footer">
        <p>© 2024 Interactive Sound Map</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
